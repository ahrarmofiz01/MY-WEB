<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IncidentLens</title>
</head>

<body>

    <h1>IncidentLens</h1>

    <p>AI-Powered Log Analysis & Debugging Platform</p>

    <h2>Upload Application Logs</h2>

    <form action="/upload" method="POST" enctype="multipart/form-data">

        <label for="logfile">Select your log file:</label>

        <input
            type="file"
            id="logfile"
            name="logfile"
            accept=".log,.txt"
            required
        >

        <button type="submit">Upload Logs</button>

    </form>

</body>

</html>
