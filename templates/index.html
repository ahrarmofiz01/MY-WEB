<!DOCTYPE html>
<html>
<head>
    <title>Smart Task Manager</title>
</head>
<style>
    h1 {
        color: rgb(0, 17, 248);
    }
    button{
        background-color: brown;
        border-radius: 20%;
        color: yellow;
    }
    h2 {
        color: blue;
}
p{
    color: blue;
}
</style>

<body >

    <h1 style=>Smart Task Manager</h1>

    <form action="/add" method="POST">
        <input
            type="text"
            name="task"
            placeholder="Enter your task"
            required
        >
        <br>

        <input type="password" name="password" placeholder="enter your password"><br>
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>

    {% for task in tasks %}
        <p>{{ task }}</p>
    {% endfor %}

</body>
</html>
