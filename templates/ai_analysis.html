
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IncidentLens - AI Analysis</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #0f172a;
            color: #e2e8f0;
            font-family: Arial, sans-serif;
        }

        .sidebar {
            background-color: #111827;
            min-height: 100vh;
            border-right: 1px solid #263244;
        }

        .brand {
            color: #38bdf8;
            font-size: 24px;
            font-weight: bold;
        }

        .sidebar a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .sidebar a:hover {
            background-color: #1e293b;
            color: white;
        }

        .main-content {
            padding: 35px;
        }

        .analysis-card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
        }

        .section-title {
            color: #f8fafc;
            font-weight: bold;
        }

        .text-muted-custom {
            color: #94a3b8;
        }

        .ai-report {
            color: #e2e8f0;
            line-height: 1.8;
        }

        .ai-report h1,
        .ai-report h2,
        .ai-report h3,
        .ai-report h4 {
            color: #38bdf8;
            margin-top: 25px;
            margin-bottom: 15px;
        }

        .ai-report p {
            margin-bottom: 15px;
        }

        .ai-report ul,
        .ai-report ol {
            padding-left: 25px;
        }

        .ai-report li {
            margin-bottom: 8px;
        }

        .ai-report code {
            background-color: #0f172a;
            color: #7dd3fc;
            padding: 3px 6px;
            border-radius: 5px;
        }

        .ai-report pre {
            background-color: #0f172a;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .ai-report blockquote {
            border-left: 4px solid #0284c7;
            padding-left: 15px;
            color: #94a3b8;
        }

        .btn-primary {
            background-color: #0284c7;
            border-color: #0284c7;
        }

        .btn-primary:hover {
            background-color: #0369a1;
            border-color: #0369a1;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-4">

            <div class="brand mb-5">
                IncidentLens
            </div>

            <a href="/">Dashboard</a>

            <a href="/history">Upload History</a>

        </div>

        <!-- Main Content -->
        <div class="col-md-10 main-content">

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>
                    <h1 class="section-title">
                        AI Incident Analysis
                    </h1>

                    <p class="text-muted-custom">
                        AI-generated troubleshooting report with retrieved documentation.
                    </p>
                </div>

                <span class="badge bg-info text-dark">
                    AI Report
                </span>

            </div>

            <!-- Analysis Report -->
            <div class="analysis-card mb-4">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <h4 class="section-title">
                        Analysis Report
                    </h4>

                    <span class="text-muted-custom">
                        Upload #{{ upload_id }}
                    </span>

                </div>

                <hr style="border-color: #334155;">

                <div class="ai-report">
                    {{ ai_html | safe }}
                </div>

            </div>

            <!-- Navigation -->
            <div class="d-flex gap-3 flex-wrap">

                <a
                    href="/incidents/{{ upload_id }}"
                    class="btn btn-primary"
                >
                    Back to Incidents
                </a>

                <a
                    href="/history"
                    class="btn btn-outline-light"
                >
                    Upload History
                </a>

                <a
                    href="/"
                    class="btn btn-outline-light"
                >
                    Dashboard
                </a>

            </div>

        </div>

    </div>
</div>

</body>
</html>
