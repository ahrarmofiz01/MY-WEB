<!DOCTYPE html>
<html>
<head>
    <title>Smart Task Manager</title>
</head>
<body>

    <h1>Smart Task Manager</h1>

    <form action="/add" method="POST">
        <input
            type="text"
            name="task"
            placeholder="Enter your task"
            required
        >
        <button type="submit">Add Task</button>
    </form>

    <h2>My Tasks</h2>

    {% for task in tasks %}
        <p>{{ task }}</p>
    {% endfor %}

</body>
</html>
